[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spong"
version = "0.0.1"
description = "Certified phase portraits of gradient descent on the MSE loss of a single scalar polynomial neuron"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
spong-random-portrait = "spong.cli:main"
spong-validate-native = "spong.validate:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spong*"]

[project.optional-dependencies]
render = ["matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: full-width founding gates (run with -m slow)"]
addopts = "-m 'not slow'"
