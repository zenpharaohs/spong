[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spong"
version = "0.0.1"
description = "Certified phase portraits of gradient descent on the MSE loss of a single scalar polynomial neuron"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
spong-random-portrait = "spong.cli:main"
spong-validate-native = "spong.validate:main"
spong-compare-portrait = "spong.comparison_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spong*"]

[project.optional-dependencies]
render = ["matplotlib"]
dev = ["pytest", "pytest-xdist"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: full-width founding gates (run with -m slow)",
    "heavy: expensive convergence studies on the hardest cases; a cheaper parameter of each stays in the default run as a smoke test (run with -m heavy)",
]
# Parallel by default: the suite is concurrency-safe (867 pass under -n auto,
# no shared-file or port failures) and runs about 2.8x faster.  Use -n 0 to
# run serially -- needed for pdb, and cheaper for a single quick test, since
# worker startup costs a second or two.
addopts = "-m 'not slow and not heavy' -n auto --dist worksteal"
