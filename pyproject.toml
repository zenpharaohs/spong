[project]
name = "spong"
version = "0.0.1"
description = "Certified phase portraits of gradient descent on the MSE loss of a single scalar polynomial neuron"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
render = ["matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
